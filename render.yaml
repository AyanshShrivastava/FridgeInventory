services:
  - type: web
    name: fridgeinventory
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn smart:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false